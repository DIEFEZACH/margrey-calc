# Temporal: descarga las fotos de verdesanto.com.mx (se borra antes de fusionar).
name: tmp-verdesanto
on:
  push:
    branches: [claude/imagenes-faltantes-0tc5af]
    paths: [.github/workflows/tmp-verdesanto.yml]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar transformaciones
        run: |
          for u in $(awk '{print $2}' tmp-verdesanto/main.txt); do
            t=$(echo "$u" | sed 's#/upload/#/upload/f_auto,q_auto,w_400/#')
            echo "$(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' -A 'Mozilla/5.0 Chrome/120' -H 'Accept: image/avif,image/webp,*/*' "$t") $t" >> tmp-verdesanto/prueba.txt
          done
      - name: Subir
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tmp-verdesanto/prueba.txt
          git commit -m "Temporal: prueba de fotos de verdesanto.com.mx"
          git push
